<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cricket Live 24 - Sony LIV Full HD</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #080d0b; color: #fff; padding: 10px; }
    
    .header-card {
      background: linear-gradient(135deg, #111a16, #16241f);
      border: 1px solid #1f362b;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 10px;
      position: relative;
    }
    .header-card h2 { font-size: 1.15rem; color: #fff; }
    .header-card .sub { color: #f59e0b; font-size: 0.85rem; font-weight: 600; margin-top: 2px; }
    .badge {
      position: absolute;
      top: 12px;
      right: 14px;
      background: #dc2626;
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .tg-banner {
      display: block;
      background: #0088cc;
      color: #fff;
      text-align: center;
      text-decoration: none;
      padding: 11px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      margin-bottom: 10px;
    }

    /* Pura Sony LIV Live TV System with All 22 Channels */
    .tv-wrapper {
      width: 100%;
      height: 85vh;
      min-height: 650px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1f362b;
    }
    .tv-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <span class="badge">● LIVE 24x7</span>
    <h2>CRICKET LIVE 24</h2>
    <div class="sub">@CricketLiveMatch24 • All Sony Sports Channels</div>
  </div>

  <a href="https://t.me/CricketLiveMatch24" target="_blank" class="tg-banner">
    👉 Join Telegram: @CricketLiveMatch24
  </a>

  <!-- Saare Channels + Audio + Video (External Telegram Redirect Blocked) -->
  <div class="tv-wrapper">
    <iframe 
      src="https://sports-era-eight.vercel.app" 
      allow="autoplay; encrypted-media; fullscreen; picture-in-picture" 
      sandbox="allow-scripts allow-same-origin allow-forms"
      allowfullscreen>
    </iframe>
  </div>

  <a href="https://t.me/CricketLiveMatch24" target="_blank" class="tg-banner" style="margin-top: 10px;">
    👉 Join Telegram: @CricketLiveMatch24
  </a>

</body>
</html>
