<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRICKET LIVE 24 - SONY LIV CHANNELS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f0e; color: #fff; padding: 12px; }

    .header-card {
      background: linear-gradient(135deg, #111a16, #16241f);
      border: 1px solid #1f362b;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      position: relative;
    }
    .header-card h2 { font-size: 1.15rem; color: #fff; margin-bottom: 2px; }
    .header-card .sub { color: #f59e0b; font-size: 0.9rem; font-weight: 600; }
    .badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #dc2626;
      color: #fff;
      font-size: 0.65rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .tg-banner {
      display: block;
      background: #0088cc;
      color: #fff;
      text-align: center;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 12px;
    }

    /* पूरा लाइव टीवी फ्रेम */
    .tv-frame {
      width: 100%;
      height: 82vh;
      min-height: 580px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #1f362b;
    }
    .tv-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="header-card">
    <span class="badge">● LIVE TV</span>
    <h2>CRICKET LIVE 24</h2>
    <div class="sub">Sony LIV Live Feeds</div>
  </div>

  <a href="https://t.me/CricketLiveMatch24" target="_blank" class="tg-banner">
    👉 Join Official Telegram: @CricketLiveMatch24
  </a>

  <!-- लाइव टीवी पैनल (बाहरी टेलीग्राम रीडायरेक्ट ब्लॉक) -->
  <div class="tv-frame">
    <iframe 
      src="https://sports-era-eight.vercel.app" 
      sandbox="allow-scripts allow-same-origin allow-forms" 
      allow="autoplay; fullscreen; encrypted-media" 
      allowfullscreen>
    </iframe>
  </div>

  <a href="https://t.me/CricketLiveMatch24" target="_blank" class="tg-banner" style="margin-top: 12px;">
    👉 Join Official Telegram: @CricketLiveMatch24
  </a>

</body>
</html>
