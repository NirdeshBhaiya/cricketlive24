<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sports Hindi - Live Match</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b110e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .header-box {
            background: #111a14;
            border: 1px solid #1f3024;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            position: relative;
        }
        .title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }
        .channel-name {
            color: #2aabee;
            font-size: 14px;
            font-weight: 600;
            margin: 4px 0 6px 0;
        }
        .sub-text {
            color: #88998d;
            font-size: 11px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .live-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #e63946;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }

        /* VIDEO CONTAINER */
        .video-box {
            position: relative;
            width: 100%;
            height: 228px;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 14px;
            border: 1px solid #1f3024;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* OVERLAY BUTTON: NEELE BUTTON KO REPLACE KAR DIYA AAPKE TELEGRAM SE */
        .smart-join-overlay {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 78%;
            height: 48px;
            z-index: 50;
            cursor: pointer;
            border-radius: 10px;
            background: #2aabee;
            color: #ffffff;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(42, 171, 238, 0.4);
        }

        .action-box {
            background: #111a14;
            border: 1px solid #1f3024;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .action-box p {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #c0b283;
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-orange {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            background: #ff8c00;
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- BRANDING HEADER -->
    <div class="header-box">
        <span class="live-badge">● LIVE NOW</span>
        <div class="title">STAR SPORTS 1 HD (HINDI)</div>
        <div class="channel-name">@CricketLiveMatch24</div>
        <div class="sub-text">LIVE CRICKET STREAMS & UPDATES</div>
    </div>

    <!-- PLAYER BOX -->
    <div class="video-box" id="playerWrap">
        <!-- AAPKA APNA BUTTON JO DUSRE KE NEELE BUTTON KE EXACT UPAR HAI -->
        <a href="https://t.me/CricketLiveMatch24" 
           target="_blank" 
           class="smart-join-overlay" 
           id="joinBtn" 
           onclick="bypassPopup()">
           Join Channel Now
        </a>

        <!-- EMBED STREAM -->
        <iframe 
            id="streamFrame"
            src="https://sports-era.github.io/Cricketvaanii/INDvsWI/" 
            allowfullscreen 
            allow="autoplay; encrypted-media; fullscreen">
        </iframe>
    </div>

    <!-- AAPKA APNA TELEGRAM BUTTON -->
    <div class="action-box">
        <p>✈ FOLLOW US FOR MORE UPDATES</p>
        <a href="https://t.me/CricketLiveMatch24" class="btn-orange" target="_blank">✈ Join Telegram</a>
    </div>

    <!-- SHARE BUTTON -->
    <div class="action-box">
        <p>🔗 SHARE STREAM</p>
        <button class="btn-orange" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied Successfully!');">Share this page link</button>
    </div>
</div>

<script>
    function bypassPopup() {
        // Click karte hi button gayab ho jayega aur video live unlock ho jayegi
        document.getElementById('joinBtn').style.display = 'none';
    }
</script>

</body>
</html>
