<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IND vs WI Live Match</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 12px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin: 12px 0;
      color: #38bdf8;
    }
    /* Video Box Container */
    .video-box {
      position: relative;
      width: 100%;
      height: 240px; /* Video ki height */
      overflow: hidden;
      border-radius: 12px;
      background-color: #000;
      border: 1px solid #334155;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }
    .video-box iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
    /* Telegram Button */
    .telegram-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 28px;
      background: linear-gradient(135deg, #0088cc, #00a8ff);
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏏 IND vs WI Live Match</h1>

    <!-- Player Window -->
    <div class="video-box">
      <iframe 
        src="https://nirdeshbhaiya.github.io/cricketlive24/CricketLiveMatch24.html?v=hindi" 
        allow="autoplay; encrypted-media; fullscreen" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- Aapka Main Telegram Button -->
    <a href="https://t.me/CricketLiveMatch24" target="_blank" class="telegram-btn">
      👉 Join Telegram Channel
    </a>
  </div>

</body>
</html>
