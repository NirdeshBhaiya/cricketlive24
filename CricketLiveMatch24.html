<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@CricketLiveMatch24 - IND VS WI Live</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b110e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .header-box {
            background: #111a14;
            border: 1px solid #1f3024;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            position: relative;
        }
        .title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }
        .channel-name {
            color: #2aabee;
            font-size: 14px;
            font-weight: 600;
            margin: 4px 0 6px 0;
        }
        .sub-text {
            color: #88998d;
            font-size: 11px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .live-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #e63946;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }
        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 14px;
            border: 1px solid #1f3024;
        }
        .video-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .action-box {
            background: #111a14;
            border: 1px solid #1f3024;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .action-box p {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #c0b283;
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-orange {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            background: #ff8c00;
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        /* --- POPUP (MODAL) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
        }
        .modal-card {
            background: #101913;
            border: 1px solid #233729;
            border-radius: 16px;
            padding: 24px 18px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .modal-title {
            font-size: 21px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .modal-desc {
            font-size: 14px;
            color: #9eb1a4;
            line-height: 1.5;
            margin: 0 0 22px 0;
        }
        .btn-join {
            display: block;
            width: 100%;
            padding: 13px;
            background: #2aabee;
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 15px;
            margin-bottom: 12px;
            box-shadow: 0 0 16px rgba(42, 171, 238, 0.4);
        }
        .btn-close {
            display: block;
            width: 100%;
            padding: 12px;
            background: transparent;
            color: #ffffff;
            border: 1px solid #2e4334;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
        }
    </style>
</head>
<body>

<!-- POPUP BOX -->
<div class="modal-overlay" id="telegramPopup">
    <div class="modal-card">
        <div class="modal-title">
            <span style="color: #2aabee;">✈</span> Join The Action
        </div>
        <p class="modal-desc">
            Get instant updates, match highlights, and exclusive links on our official channel.
        </p>
        <a href="https://t.me/CricketLiveMatch24" target="_blank" class="btn-join">Join Channel Now</a>
        <button class="btn-close" onclick="closePopup()">I've Already Joined</button>
    </div>
</div>

<div class="container">
    <!-- HEADER -->
    <div class="header-box">
        <span class="live-badge">● LIVE NOW</span>
        <div class="title">INDIA VS WEST INDIES</div>
        <div class="channel-name">@CricketLiveMatch24</div>
        <div class="sub-text">SPORTS LIVE STREAMS & UPDATES</div>
    </div>

    <!-- LIVE MATCH STREAM (Sports-era source embedded directly) -->
    <div class="video-box">
        <iframe src="https://sports-era.github.io/Cricketvaanii/INDvsWI/" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>

    <!-- TELEGRAM BUTTON BOX -->
    <div class="action-box">
        <p>✈ FOLLOW US FOR MORE UPDATES</p>
        <a href="https://t.me/CricketLiveMatch24" class="btn-orange" target="_blank">✈ Join Telegram</a>
    </div>

    <!-- SHARE BUTTON BOX -->
    <div class="action-box">
        <p>🔗 SHARE STREAM</p>
        <button class="btn-orange" onclick="copyStreamLink()">Share this page link</button>
    </div>
</div>

<script>
    function closePopup() {
        document.getElementById('telegramPopup').style.display = 'none';
    }
    function copyStreamLink() {
        navigator.clipboard.writeText(window.location.href);
        alert('Link Copied Successfully!');
    }
</script>

</body>
</html>
