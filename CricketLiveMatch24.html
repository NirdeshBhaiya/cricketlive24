<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IND vs WI Live Match</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #1e293b;
      padding: 40px 25px;
      border-radius: 18px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      border: 1px solid #334155;
    }
    .icon {
      font-size: 48px;
      margin-bottom: 15px;
    }
    h1 {
      font-size: 22px;
      margin-bottom: 12px;
      color: #38bdf8;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .telegram-btn {
      display: block;
      width: 100%;
      padding: 16px 0;
      background: linear-gradient(135deg, #0088cc, #00a8ff);
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .telegram-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 6px 20px rgba(0, 136, 204, 0.6);
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">🏏</div>
    <h1>IND vs WI Live Match</h1>
    <p>Live updates, match streaming links aur score dekhne ke liye hamara official Telegram channel join karein.</p>
    
    <a href="https://t.me/CricketLiveMatch24" target="_blank" class="telegram-btn">
      👉 Join Telegram Channel
    </a>
  </div>

</body>
</html>
