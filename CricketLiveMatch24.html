<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Sports 1 Hindi - Live</title>
    <!-- Shaka Player for Live Stream Playback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b110e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 420px;
        }
        .header-box {
            background: #111a14;
            border: 1px solid #1f3024;
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 14px;
            position: relative;
        }
        .title {
            font-size: 19px;
            font-weight: 800;
            line-height: 1.3;
            letter-spacing: 0.5px;
        }
        .channel-name {
            color: #2aabee;
            font-size: 14px;
            font-weight: 600;
            margin: 4px 0 6px 0;
        }
        .sub-text {
            color: #88998d;
            font-size: 11px;
            letter-spacing: 0.8px;
            text-transform: uppercase;
        }
        .live-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #e63946;
            color: #fff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }

        /* DIRECT IN-BUILT PLAYER */
        .video-box {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            background: #000;
            margin-bottom: 14px;
            border: 1px solid #1f3024;
        }
        .video-box video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
        }

        .action-box {
            background: #111a14;
            border: 1px solid #1f3024;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
        }
        .action-box p {
            margin: 0 0 10px 0;
            font-size: 12px;
            color: #c0b283;
            text-transform: uppercase;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-orange {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 13px;
            background: #ff8c00;
            color: #000;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <span class="live-badge">● LIVE NOW</span>
        <div class="title">STAR SPORTS 1 HD (HINDI)</div>
        <div class="channel-name">@CricketLiveMatch24</div>
        <div class="sub-text">LIVE CRICKET STREAMS & UPDATES</div>
    </div>

    <!-- DIRECT IN-BUILT PLAYER (NO IFRAME BLOCK) -->
    <div class="video-box">
        <video id="videoPlayer" controls autoplay playsinline></video>
    </div>

    <div class="action-box">
        <p>✈ FOLLOW US FOR MORE UPDATES</p>
        <a href="https://t.me/CricketLiveMatch24" class="btn-orange" target="_blank">✈ Join Telegram</a>
    </div>

    <div class="action-box">
        <p>🔗 SHARE STREAM</p>
        <button class="btn-orange" onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied Successfully!');">Share this page link</button>
    </div>
</div>

<script>
    async function initApp() {
        shaka.polyfill.installAll();
        if (shaka.Player.isBrowserSupported()) {
            const video = document.getElementById('videoPlayer');
            const player = new shaka.Player(video);

            // ClearKey DRM Keys for Star Sports Hindi stream
            player.configure({
                drm: {
                    clearKeys: {
                        'f9e578c74d32098492067756f1ddde48': '93b8e5c85b1bfda3039d96e578c2e912'
                    }
                }
            });

            try {
                // Direct Star Sports Stream Manifest
                await player.load('https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_1_Hindi_MOB/Fallback/index.mpd');
            } catch (e) {
                // Alternate fallback stream if key rotates
                player.load('https://jiotvpllive.cdn.jio.com/bpk-tv/Star_Sports_1_Hindi_MOB/Live/index.mpd');
            }
        }
    }
    document.addEventListener('DOMContentLoaded', initApp);
</script>

</body>
</html>
