<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IND vs WI Live Match</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 10px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 20px;
      margin: 10px 0 14px 0;
      color: #38bdf8;
    }

    /* Video player frame */
    .video-box {
      position: relative;
      width: 100%;
      height: 380px; /* Perfect height taaki match na kate */
      overflow: hidden;
      border-radius: 14px;
      background-color: #000;
      border: 1px solid #334155;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }
    .video-box iframe {
      position: absolute;
      top: -155px; /* Upar ka banner cut karne ke liye */
      left: 0;
      width: 100%;
      height: 600px;
      border: 0;
    }

    /* Aapka Telegram Button */
    .telegram-btn {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 32px;
      background: linear-gradient(135deg, #0088cc, #00a8ff);
      color: #ffffff;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      border-radius: 50px;
      box-shadow: 0 4px 15px rgba(0, 136, 204, 0.4);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏏 IND vs WI Live Match</h1>

    <!-- Live Match Screen -->
    <div class="video-box">
      <iframe 
        src="https://sports-era.github.io/INDvsWI/" 
        allow="autoplay; encrypted-media; fullscreen" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- Aapka Official Telegram Button -->
    <a href="https://t.me/CricketLiveMatch24" target="_blank" class="telegram-btn">
      👉 Join Telegram Channel
    </a>
  </div>

</body>
</html>
